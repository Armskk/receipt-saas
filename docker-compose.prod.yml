# Override for the deployed environments (stg, production). Layer it over the base file:
#
#   docker compose -p receipt-stg --env-file .env.stg \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# One compose PROJECT per environment (-p receipt-stg / -p receipt-prod), each with its
# own containers, volumes, secrets and env files. Needs Docker Compose >= 2.24 (`!reset`,
# `!override`). Full runbook: docs/environments.md ("Deploying an environment").
#
# What this changes vs. the dev setup:
#   - Nothing in the project publishes a host port. Postgres, Redis and MinIO are only
#     reachable from inside the project's own network; backend and frontend are only
#     reachable from the shared "edge" network, where the single Caddy
#     (docker-compose.edge.yml) is the only thing that publishes 80/443.
#   - The per-project Caddy of the base file is switched off (one Caddy serves all envs).
#   - The API and worker read this environment's env file (BACKEND_ENV_FILE), generated by
#     scripts/init-env.sh, instead of backend/.env. The frontend needs no runtime env: its
#     NEXT_PUBLIC_* values are build args (they are inlined into the bundle by `next build`).
#   - A one-shot `migrate` service applies the database migrations (with the DB owner URL, which
#     only that service gets) before the API and worker start; the API has a /health healthcheck.
#   - Container logs are rotated so they can't fill the VM's disk.
#
# Requires in the --env-file: ENV_NAME (stg | production), BACKEND_ENV_FILE, OWNER_DATABASE_URL,
# NEXT_PUBLIC_API_URL (all written by scripts/init-env.sh).

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    ports: !reset []
    logging: *logging

  redis:
    ports: !reset []
    logging: *logging

  minio:
    ports: !reset []
    logging: *logging

  backend:
    ports: !reset []
    env_file: !override
      - ${BACKEND_ENV_FILE:?BACKEND_ENV_FILE must be set in the env file}
    # Aliases must be unique per environment: every project's `backend` would otherwise
    # answer to the plain name `backend` on the shared edge network.
    networks:
      default: {}
      edge:
        aliases:
          - ${ENV_NAME:?ENV_NAME must be set in the env file (stg or production)}-backend
    # Never start against an unmigrated schema.
    depends_on:
      migrate:
        condition: service_completed_successfully
    # /health answers 200 only when Postgres and Redis do (busybox wget: the image has no curl).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging

  worker:
    env_file: !override
      - ${BACKEND_ENV_FILE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging: *logging

  frontend:
    ports: !reset []
    # No runtime env: replaces the base file's ./frontend/.env.local (dev values must not leak in).
    env_file: !reset []
    build:
      args:
        # Inlined into the JS bundle at build time — a change needs a rebuild (up --build).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set in the env file}
        NEXT_PUBLIC_LINE_ADD_FRIEND_URL: ${NEXT_PUBLIC_LINE_ADD_FRIEND_URL:-}
        NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${NEXT_PUBLIC_TELEGRAM_BOT_USERNAME:-}
    networks:
      default: {}
      edge:
        aliases:
          - ${ENV_NAME}-frontend
    logging: *logging

  # Applies the schema migrations, then exits. Runs on every `up` (`prisma migrate deploy` only
  # applies what's pending) and holds the DB OWNER credentials — the only service that does.
  # Migrations are forward-only: see the rollback notes in docs/environments.md.
  migrate:
    build:
      context: ./backend
      target: migrate
    environment:
      DATABASE_URL: ${OWNER_DATABASE_URL:?OWNER_DATABASE_URL must be set in the env file}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  # The base file's Caddy is for a single-environment dev stack. Here the shared edge
  # Caddy does the routing, so this one only starts if its profile is asked for.
  caddy:
    profiles: ["single-env-caddy"]

networks:
  # Created once per VM: `docker network create receipt-edge`.
  edge:
    external: true
    name: receipt-edge
