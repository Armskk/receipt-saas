# Override for the deployed environments (stg, production). Layer it over the base file:
#
#   docker compose -p receipt-stg --env-file .env.stg \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# One compose PROJECT per environment (-p receipt-stg / -p receipt-prod), each with its
# own containers, volumes, secrets and env files. Needs Docker Compose >= 2.24 (`!reset`,
# `!override`). Full runbook: docs/environments.md ("Deploying an environment").
#
# What this changes vs. the dev setup:
#   - Nothing in the project publishes a host port. Postgres, Redis and MinIO are only
#     reachable from inside the project's own network; backend and frontend are only
#     reachable from the shared "edge" network, where the single Caddy
#     (docker-compose.edge.yml) is the only thing that publishes 80/443.
#   - The per-project Caddy of the base file is switched off (one Caddy serves all envs).
#   - Each service reads this environment's env files (BACKEND_ENV_FILE / FRONTEND_ENV_FILE),
#     generated by scripts/init-env.sh, instead of backend/.env and frontend/.env.local.
#   - Container logs are rotated so they can't fill the VM's disk.
#
# Requires in the --env-file: ENV_NAME (stg | production), BACKEND_ENV_FILE, FRONTEND_ENV_FILE.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    ports: !reset []
    logging: *logging

  redis:
    ports: !reset []
    logging: *logging

  minio:
    ports: !reset []
    logging: *logging

  backend:
    ports: !reset []
    env_file: !override
      - ${BACKEND_ENV_FILE:?BACKEND_ENV_FILE must be set in the env file}
    # Aliases must be unique per environment: every project's `backend` would otherwise
    # answer to the plain name `backend` on the shared edge network.
    networks:
      default: {}
      edge:
        aliases:
          - ${ENV_NAME:?ENV_NAME must be set in the env file (stg or production)}-backend
    logging: *logging

  worker:
    env_file: !override
      - ${BACKEND_ENV_FILE}
    logging: *logging

  frontend:
    ports: !reset []
    env_file: !override
      - ${FRONTEND_ENV_FILE:?FRONTEND_ENV_FILE must be set in the env file}
    networks:
      default: {}
      edge:
        aliases:
          - ${ENV_NAME}-frontend
    logging: *logging

  # The base file's Caddy is for a single-environment dev stack. Here the shared edge
  # Caddy does the routing, so this one only starts if its profile is asked for.
  caddy:
    profiles: ["single-env-caddy"]

networks:
  # Created once per VM: `docker network create receipt-edge`.
  edge:
    external: true
    name: receipt-edge
